<header class="sticky-top bg-white border-bottom border-light-subtle shadow-xs z-3">
    <div class="topbar py-2">
        <div class="container-fluid">
            <div class="navbar-header d-flex align-items-center justify-content-between">
                <!-- Left: Sidebar Toggle Button & Brand Title -->
                <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center button-toggle-menu" title="Alternar Menu Lateral">
                        <i class="ri-menu-2-line fs-20 text-dark"></i>
                    </button>

                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-primary rounded-pill px-2.5 py-1 fw-bold fs-12">GPS Paraíba ERP</span>
                    </div>
                </div>

                <!-- Right: Site Home Link & User Profile Dropdown -->
                <div class="d-flex align-items-center gap-2">
                    <!-- Home Landing Page Link -->
                    <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold d-inline-flex align-items-center gap-1">
                        <i class="ri-home-4-line fs-16"></i>
                        <span class="d-none d-sm-inline">Ver Site Público</span>
                    </a>

                    <!-- User Profile Dropdown -->
                    <div class="dropdown">
                        <a type="button" class="btn btn-light rounded-pill px-3 py-1-5 border d-flex align-items-center gap-2" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="ri-user-3-fill text-primary fs-18"></i>
                            <span class="fw-bold text-dark fs-13 d-none d-md-inline">{{ user_email if user_email else 'Frotista' }}</span>
                            <i class="ri-arrow-down-s-line text-muted"></i>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-3 mt-2">
                            <h6 class="dropdown-header text-dark fw-bold">Olá, {{ user_email if user_email else 'Frotista' }}!</h6>
                            <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="/">
                                <i class="ri-global-line text-primary fs-16"></i>
                                <span>Voltar ao Site da GPS Paraíba</span>
                            </a>
                            <div class="dropdown-divider my-1"></div>
                            <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger fw-bold" href="/logout">
                                <i class="ri-logout-box-r-line fs-16"></i>
                                <span>Sair do Sistema</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
